name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Build
        run: npm run build

      - name: Test
        run: npm test -- --ci

      # Fails if the schema and migrations have drifted apart. Needs a
      # migrated database in secrets.DATABASE_URL; without it the step is
      # skipped with a warning — never silently green.
      - name: Prisma drift check
        if: ${{ secrets.DATABASE_URL != '' }}
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npm run check:drift

      - name: Note drift check skipped
        if: ${{ secrets.DATABASE_URL == '' }}
        run: echo "::warning::secrets.DATABASE_URL not set; prisma migrate diff drift check was skipped"

      - name: Tenant RLS ratchet
        run: node scripts/check-tenant-rls.mjs

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

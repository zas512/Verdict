[project]
name = "verdict"
version = "0.1.0"
description = "AI backend for Verdict"
readme = "README.md"
authors = [
    { name = "zas512", email = "zainalis.914@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "beautifulsoup4>=4.15.0",
    "chromadb>=1.5.9",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "llama-index>=0.14.24",
    "llama-index-embeddings-ollama",
    "llama-index-embeddings-openai>=0.6.0",
    "llama-index-llms-ollama",
    "llama-index-vector-stores-chroma>=0.6.0",
    "loguru>=0.7.3",
    "markdown>=3.10.3",
    "numpy>=2.5.2",
    "ollama>=0.6.2",
    "pandas>=3.0.5",
    "pdfplumber>=0.11.10",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pypdf>=6.16.2",
    "python-docx>=1.2.0",
    "python-dotenv>=1.2.3",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "tiktoken>=0.14.0",
    "tqdm>=4.70.0",
    "typing-extensions>=4.16.0",
    "unstructured>=0.27.5",
    "uvicorn>=0.52.4",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "black>=26.5.1",
    "ipython>=9.17.1",
    "jupyter>=1.1.1",
    "mypy>=2.3.1",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "pytest-cov>=7.1.0",
]
